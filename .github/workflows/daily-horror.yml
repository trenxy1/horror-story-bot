name: Daily Horror Story Video

on:
  schedule:
    # 2 runs/day, each uploading 2 videos (long story + Shorts) = 4 uploads/day.
    # Long-form rendering takes longer than the news bot, so timeout is higher.
    - cron: "0 8 * * *"    # 9:00 AM WAT
    - cron: "0 20 * * *"   # 9:00 PM WAT
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg + imagemagick for video/captions)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core

      - name: Relax ImageMagick's text policy
        run: |
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/rights="none" pattern="text"/rights="read|write" pattern="text"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the pipeline (theme, stories, voice, images, videos, upload)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python main.py --upload

      - name: Upload videos as workflow artifacts (backup / manual review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horror-videos-${{ github.run_number }}
          path: output/videos/*.mp4
          retention-days: 7

      - name: Commit updated theme tracking back to repo
        if: always()
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git add output/data/themes.json
          git diff --cached --quiet || git commit -m "Update theme tracking [skip ci]"
          git push
